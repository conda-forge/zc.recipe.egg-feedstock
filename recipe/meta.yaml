{% set name = "zc.recipe.egg" %}
{% set version = "4.0.0" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/zc_recipe_egg-{{ version }}.tar.gz"
  sha256: e371f70b0e801f5a712f5592dcaae0af77c6897c01c3210591e164d9c7c8642c

build:
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv"

requirements:
  host:
    - pip
    - python
    - setuptools
    # - zc.buildout >=2.12.0
    # remove line below and uncomment line above after zc.buildout can be built with setuptools>52
    - zc.buildout 2.13.3
  run:
    - python
    - setuptools
    - {{ pin_compatible('zc.buildout') }}

test:
  imports:
    - zc
    - zc.recipe
    - zc.recipe.egg

about:
  home: "http://cheeseshop.python.org/pypi/zc.recipe.egg"
  license: ZPL-2.1
  license_family: OTHER
  license_file: LICENSE.txt
  summary: "Recipe for installing Python package distributions as eggs"
  doc_url: https://pypi.org/project/zc.recipe.egg/#detailed-documentation
  dev_url: https://github.com/buildout/buildout/tree/master/zc.recipe.egg_

extra:
  recipe-maintainers:
    - 183amir
    - lcolbois
